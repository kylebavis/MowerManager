name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore MowerManager.slnx

      # Fails on known advisories, transitive packages included. `dotnet list` exits zero either way.
      - name: Audit dependencies
        run: |
          report=$(dotnet list MowerManager.slnx package --vulnerable --include-transitive)
          echo "$report"
          if echo "$report" | grep -q 'has the following vulnerable packages'; then
            echo "::error::Vulnerable NuGet packages found — see the report above."
            exit 1
          fi

      - name: Build
        run: dotnet build MowerManager.slnx -c Release --no-restore

      - name: Test
        run: dotnet test --solution MowerManager.slnx -c Release --no-build

  image:
    name: Build container image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Build only; publishing happens in release.yml.
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: final
          push: false
          load: true
          tags: mower-manager:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Dummy Husqvarna credentials: the app must start and serve without reaching the real API.
      - name: Smoke test the image
        run: |
          docker run -d --name mm-ci -p 8080:8080 \
            -e Husqvarna__AppKey=ci -e Husqvarna__AppSecret=ci -e Husqvarna__StreamEnabled=false \
            -e Auth__Local__InitialAdminUsername=ci -e Auth__Local__InitialAdminPassword=ci-smoke-test \
            mower-manager:ci

          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/health >/dev/null 2>&1; then
              echo "healthy after ${i}s"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "did not become healthy"
              docker logs mm-ci
              exit 1
            fi
            sleep 1
          done

          status=$(curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' \
            -d '{"username":"ci","password":"ci-smoke-test"}' http://localhost:8080/api/auth/login)
          if [ "$status" != "204" ]; then
            echo "login returned $status"
            docker logs mm-ci
            exit 1
          fi
          echo "login OK"

      - name: Remove the smoke-test container
        if: always()
        run: docker rm -f mm-ci >/dev/null 2>&1 || true
