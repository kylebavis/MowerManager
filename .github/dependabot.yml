version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # EF Core, ASP.NET and test packages ship in lockstep; one PR per release train.
      microsoft:
        patterns: ["Microsoft.*", "System.*"]

  # Actions are pinned to commit SHAs; this is what moves the pins.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Base images are pinned by digest; this moves the pins.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # sdk and aspnet refresh together; one PR per refresh.
      dotnet-images:
        patterns: ["*"]
