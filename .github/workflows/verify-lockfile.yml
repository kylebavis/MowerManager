# Fails when actions.lock is out of sync with the workflows or a locked pin no longer verifies upstream.
name: Verify lockfile

on:
  pull_request:
  push:
    branches: [main]
  # Catches upstream tags re-pointed after locking.
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify actions.lock
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: gh extension install github/gh-actions-lock --pin v0.4.1
      - run: gh actions-lock --verify
